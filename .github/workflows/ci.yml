name: CI (Pull Request)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Modell-Shards: gleicher Schlüssel in ci.yml und deploy.yml. Er hängt nur von den gepinnten
      # Revisionen (im Skript) und der Gewichtsaufbereitung ab, nicht vom Forward-Pass.
      # Hinweis: Caches aus PR-Branches sind auf main nicht sichtbar; main-Caches sind es für PRs.
      - name: Modell-Shards aus dem Cache holen
        id: models
        uses: actions/cache/restore@v4
        with:
          path: .cache/models
          key: models-v1-${{ hashFiles('scripts/prepare-models.ts', 'src/engine/model/weights.ts', 'src/engine/model/quantize.ts', 'src/engine/model/pack.ts', 'src/engine/model/safetensors.ts') }}

      - name: Modell-Shards erzeugen (nur bei Cache-Miss)
        if: steps.models.outputs.cache-hit != 'true'
        run: npm run prepare-models

      - name: Modell-Shards im Cache speichern
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/models
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Cache-Status
        run: |
          echo "Shards aus dem Cache: ${{ steps.models.outputs.cache-hit == 'true' && 'ja' || 'nein (neu erzeugt)' }}"
          echo "Shards aus dem Cache: ${{ steps.models.outputs.cache-hit == 'true' && 'ja' || 'nein (neu erzeugt)' }}" >> "$GITHUB_STEP_SUMMARY"
          du -sh .cache/models/*/* || true

      - name: Tests (inkl. Golden-Tests gegen die echten Shards)
        run: npm test
        env:
          REQUIRE_MODELS: '1'

      - name: Benchmark Batch-Prefill
        run: node --experimental-strip-types scripts/bench-prefill.ts 64

      - name: Build (inkl. Shards nach dist/models und Größenprüfung)
        run: npm run build

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Screenshots, Smoke-Test und Interaktionsprüfung
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 -t 30000 http://localhost:4173/
          npm run screenshots -- http://localhost:4173/ screenshots
          npm run check:ui -- http://localhost:4173/ --models

      - name: Screenshots als Artifact anhängen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
