<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inside GenAI – interaktives Lernkompendium: Wie Sprachmodelle aus einem Prompt eine Antwort machen." />
    <title>Inside GenAI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23B5562F' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23B5562F'/%3E%3C/svg%3E" />
    <script>
      // Einstellungen vor dem ersten Rendern anwenden (kein Aufblitzen).
      // Schlüssel und Format: src/state/settings.ts (zustand persist).
      (function () {
        var s = {};
        try {
          s = (JSON.parse(localStorage.getItem('igai.settings') || '{}').state) || {};
        } catch (e) {}
        var pref = s.theme || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var el = document.documentElement;
        el.setAttribute('data-theme', dark ? 'dark' : 'light');
        el.setAttribute('data-math', s.math === false ? 'off' : 'on');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
